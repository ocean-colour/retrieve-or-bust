name: CI

# Runs on every branch (all milestone work happens on feature branches such as
# rt-elastic-prototype, so main-only CI would give no signal while a milestone is
# being built) and on pull requests. The concurrency group cancels superseded
# runs on the same ref so a rapid series of pushes does not queue up.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor declared in setup.py (and jax 0.11 requires >= 3.12);
        # 3.14 is what the ocean14 development environment runs.
        python-version: ['3.12', '3.14']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Deliberately NOT `pip install -r requirements.txt`. That file is the
      # developer's full environment: it pulls ocpy's heavy extras (cartopy,
      # geopandas, healpy, netcdf4) plus bing/emcee/bokeh/seaborn, none of which
      # the test suite imports. Installing only what the tests actually use keeps
      # CI fast and makes a red build mean "our code broke", not "a geospatial
      # wheel failed to build". CPU-only JAX: the plain wheel is CPU on Linux.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jax flax optax jaxtyping numpy scipy xarray pytest

      # ocpy supplies the Loisel+2023 loader that robust.rt.data.l23 builds on
      # (M1 onward). --no-deps for the reason above: robust only touches
      # ocpy.hydrolight.loisel23, which needs numpy + xarray, already installed.
      - name: Install ocpy (L23 loader), without its heavy extras
        run: pip install --no-deps git+https://github.com/ocean-colour/ocpy

      - name: Install the package
        run: pip install -e . --no-deps

      - name: Show the environment
        run: |
          python -c "import jax; print('jax', jax.__version__, jax.default_backend(), jax.devices())"
          pip list

      # The L23 netCDFs (~17 MB each) are not in the repo and $OS_COLOR is unset
      # here, so the data-dependent tests skip rather than fail (see
      # robust/tests/conftest.py). -ra prints the skip reasons, so a skip that
      # should have been a pass is visible in the log instead of silent.
      - name: Run the test suite
        run: pytest -q -ra

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # `ruff.toml` at the repo root pins the rule selection (E/F/I/W/UP/B, line
      # length 88, py312), so what "clean" means is now a property of the repo
      # rather than of whichever ruff got installed. The version pin stays for
      # determinism: a new ruff can still add rules within those categories.
      - name: Install ruff
        run: pip install ruff==0.16.0

      # Scoped to robust/ deliberately: the pre-existing scripts under
      # reports/py/ and context/RT/ predate the config and are not part of the
      # package.
      - name: Lint the package
        run: ruff check robust/

      - name: Check formatting
        run: ruff format --check robust/

  docs:
    name: sphinx (-W)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.12 only, not a matrix: Read the Docs builds this site on
      # ubuntu-24.04 / python 3.12 (see .readthedocs.yaml), so CI's job is to
      # catch a broken build *before* RTD does, on the same interpreter. A
      # second Python version would test Sphinx, not us.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # docs/requirements.txt, not the root requirements.txt, and for the same
      # reason the test job avoids it: the root file's two `git+` lines drag in
      # ocpy's geospatial extras that no page needs. This file carries the
      # Sphinx toolchain *plus* the real import-time stack (jax, jaxtyping,
      # numpy, flax, optax), because conf.py sets `autodoc_mock_imports = []`
      # -- autodoc genuinely imports robust.rt, so the rendered signatures and
      # jaxtyping shapes are the real ones rather than mock repr's.
      - name: Install the documentation toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      # --no-deps for the same reason as the test job: everything robust
      # actually imports is already installed by the step above, and letting pip
      # re-resolve here would only risk pulling a different jax. This step
      # exists so autodoc can `import robust.rt` from an installed package
      # rather than relying on conf.py's sys.path insert alone.
      #
      # Known and deliberate divergence from RTD: .readthedocs.yaml runs a plain
      # `pip install .`, which resolves the whole of setup.py's install_requires
      # (matplotlib, seaborn, bokeh, scikit-learn, xarray, ...). This job does
      # not, so it will *not* catch a dependency-resolution failure in that
      # tree -- only a Sphinx/autodoc one. Mirroring RTD exactly would mean
      # dropping --no-deps here and installing a dozen packages no page uses on
      # every push. If RTD ever fails on resolution while this job is green,
      # that gap is the reason.
      - name: Install the package
        run: pip install -e . --no-deps

      # No $OS_COLOR and no L23 netCDFs are needed here, unlike the test job:
      # the docs build only *copies* figures that are already committed under
      # reports/ (docs/figures/make_docs_figures.py defaults to copy mode;
      # regeneration, which does need L23, is opt-in via --regenerate and is
      # never reachable from conf.py). If a future page starts regenerating a
      # figure at build time, this job is what will break -- and this comment is
      # why.
      #
      # -W turns every warning into an error, which is the whole point: a page
      # missing from a toctree, a broken cross-reference or a bad image path all
      # become build failures instead of quietly-degraded pages. --keep-going
      # reports every such problem in one run rather than stopping at the first,
      # so a red build is one fix-up cycle, not five. RTD itself builds with
      # fail_on_warning: false so a stray environment warning there can never
      # block publication -- the strict gate lives here.
      - name: Build the documentation strictly
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
